case 'v2-job':{let j=find(d.jobs||[],id);if(!j||!(isHR()||isIT()&&j.action==='Provision account task'))return;j.status='Completed';j.completedBy=me();commit('Automation task acknowledged',id,'Task marked complete; no external action executed.');break;}
case 'v2-event':eventForm();break;case 'v2-prev':calCursor.setMonth(calCursor.getMonth()-1);render();break;case 'v2-next':calCursor.setMonth(calCursor.getMonth()+1);render();break;
case 'v2-day':{let day=el.dataset.value;open(day,calendarEvents().filter(x=>x.date===day).map(x=>rowItem('•',x.title,x.time||'All day',(d.events||[]).some(e=>e.id===x.id&&e.person===me())?B('Remove','v2-delete-event','data-id="'+x.id+'"'):'')).join('')+B('Add event','v2-add-day','data-value="'+day+'"','primary'));break;}
case 'v2-add-day':eventForm(el.dataset.value);break;case 'v2-delete-event':d.events=(d.events||[]).filter(x=>x.id!==id||x.person!==me());commit('Personal event removed',id);break;
case 'v2-tsx':{let t=find(d.templates,id);if(!t||!isHR())return;let content=`// Generated review template. No dynamic code execution.\nimport React from 'react';\nconst text = ${JSON.stringify(t.body)};\nexport default function Template({ values }: {values: Record<string,string>}) {\n  const rendered = text.replace(/\\{\\{([\\w.]+)\\}\\}/g, (_, k: string) => values[k] ?? '');\n  return <article style={{whiteSpace:'pre-wrap'}}>{rendered}</article>;\n}\n`;download(t.id+'.tsx',content);break;}
}},true);
document.addEventListener('submit',e=>{let f=e.target.closest('[data-form]');if(!f||!f.dataset.form.startsWith('v2-'))return;e.preventDefault();e.stopImmediatePropagation();let g=n=>String(new FormData(f).get(n)||''),d=db(),id=f.dataset.id;switch(f.dataset.form){case 'v2-company-sign':{let x=find(d.docs,id);if(!x||x.issuer!==me()||x.status!=='Awaiting company signature'||!g('confirm')||!sigDirty){notify('Draw and confirm the signature as the assigned signer.');return}x.companySignature=$('#sig').toDataURL('image/png');x.status='Issued';x.history.push('Company signature confirmed · '+fmt(now()));commit('Document signed and delivered',id);break;}
case 'v2-checkout':{let x=find(d.attendance,id);if(!x||x.person!==me()||x.status!=='Accepted'||x.out)return;if(g('time')<=x.time){notify('Sample Time Out must be later than Time In (same-day shift).');return}x.out=g('time');commit('Sample Time Out recorded',id);break;}
case 'v2-adjust':{let x=find(d.adjustments||[],id);if(!x||!(isHR()||actor==='Finance'))return;x.status='Reviewed';x.note=g('reason');x.by=me();commit('Payroll adjustment reviewed',id);break;}
case 'v2-event':d.events??=[];d.events.push({id:uid(company+'-CAL'),person:me(),date:g('date'),time:g('time'),title:g('title'),notes:g('notes')});commit('Personal calendar event saved',g('title'));break;}
},true);
document.addEventListener('change',async e=>{if(e.target.name==='source'&&e.target.files?.[0]?.name.toLowerCase().endsWith('.txt')){let f=e.target.closest('form'),text=await e.target.files[0].text();if(text.length>100000){notify('Text exceeds the sample import limit.');return}let area=f.querySelector('[name=body]');if(area){area.value=text;let fields=f.querySelector('[name=fields]');if(fields)fields.value=[...new Set([...text.matchAll(/\{\{([\w.]+)\}\}/g)].map(x=>x[1]))].join(', ');notify('Text imported; review the content before publishing.')}}});

</script></body></html>
